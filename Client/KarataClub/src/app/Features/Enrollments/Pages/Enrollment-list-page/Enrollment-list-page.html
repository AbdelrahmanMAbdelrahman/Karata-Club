<div class="Enrollment-page">
    <div class="Enrollment-search">
        <app-Enrollment-search-component
        (OnSearch)="Search($event)"
        ></app-Enrollment-search-component>
    </div>
    <div class="Enrollment-list">
        <app-Enrollment-list-component
        [Enrollments]="(Enrollments|async)!"
        (OnPaginate)="Paginate($event)"
        ></app-Enrollment-list-component>
    </div>
</div>
