<div class="card">
   <form action="" [formGroup]="searchForm!" (submit)="Search()">

       <div class="card-body">
        <div class="form-groups">

            <div class="form-group">
                <label for="courseName" class="form-label">Name</label>
                <input formControlName="courseName" type="text" id="courseName" class="form-control">
            </div>          
                  
        </div>
    </div>
    <div class="card-footer">
      <div class="footer-btns">
        <button (click)="ClearInput()" type="button" class="btn btn-secondary">Clear</button>
        <button  class="btn btn-primary">Search</button>
      </div>             
    </div>
</form>
</div>
