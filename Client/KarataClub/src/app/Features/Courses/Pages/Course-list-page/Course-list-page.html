<div class="Course-page">
    <div class="Course-search">
        <app-Course-search-component
        (OnSearch)="Search($event)"
        ></app-Course-search-component>
    </div>
    <div class="Course-list">
        <app-Course-list-component
        [Courses]="(Courses|async)!"
        (OnPaginate)="Paginate($event)"
        ></app-Course-list-component>
    </div>
</div>
