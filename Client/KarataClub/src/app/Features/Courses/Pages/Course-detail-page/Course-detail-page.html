<div class="card">
<div class="card-body">

    <app-Course-detail-component
    [Course]="(Course|async)!.course"
></app-Course-detail-component>
</div>
<div class="card-footer">

    <div class="card-footer">
        <div class="footer-btns">
            <button type="button" class="btn btn-secondary">Cancel</button>
            <button type="button" class="btn btn-danger">Delete</button>
            <button type="button" class="btn btn-primary">Deactivate</button>
            <button type="button" (click)="StartNewSession()" class="btn btn-outline-primary">Start New Session</button>
        </div>
    </div>
</div>
