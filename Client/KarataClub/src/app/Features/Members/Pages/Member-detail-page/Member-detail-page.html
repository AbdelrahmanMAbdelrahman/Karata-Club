<div class="card">
<div class="card-body">

    <app-Member-detail-component
    [Member]="(Member|async)!"></app-Member-detail-component>
</div>
<div class="card-footer">
    
    <div class="card-footer">
        <div class="footer-btns">
            <button class="btn btn-danger">Delete</button>
            <button [routerLink]="['/SubscriptionPage','SubscriptionCreatePage',Id]" class="btn btn-primary">Subscribe - Renew</button>
            <button (click)="NavigateToEnrollment()" class="btn btn-outline-primary">
                Enroll In Course
            </button>
            <button [routerLink]="['/BeltTestPage','BeltTestCreatePage',Id]" class="btn btn-outline-primary">Schedule Belt Test</button>
        </div>
    </div>
    <app-BeltTest-list-component [BeltTests]="(beltTests|async)!"></app-BeltTest-list-component>
</div>
