<div class="Member-page">
    <div class="Member-search">
        <app-Member-search-component
        (OnSearch)="Search($event)"
        ></app-Member-search-component>
    </div>
    <div class="Member-list">
        <app-Member-list-component
        [Members]="(Members|async)!"
        (OnPaginate)="paginate($event)"
        ></app-Member-list-component>
    </div>
</div>
