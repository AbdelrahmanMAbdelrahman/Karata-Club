<div class="card">
    <form action="" (submit)="Save()" [formGroup]="form!">

        <div class="card-body">
            <!-- @if (member(); as currentMember) { -->
                <app-Member-detail-component [Member]="member()"></app-Member-detail-component>
            <!-- } -->
               
                    
                    <app-BeltRank-detail-component [BeltRank]="BeltRank()"></app-BeltRank-detail-component>
               
                    <div class="form-groups">
                
                <div class="form-group">
                    <label for="instructorId" class="form-label">Instructor</label>
                    <select name="instructorId" id="instructorId" formControlName="instructorId" class="form-select">
                        <option *ngFor="let instructor of Instructors?.items" [value]="instructor.instructorId">{{instructor.person.name}}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="address" class="form-label">Notes</label>
                    <textarea type="text" id="notes" formControlName="notes" class="form-control"></textarea>
                </div>
       
             </div>    
        </div>
        <div class="card-footer">
            <div class="footer-btns">
                <button (click)="Clear()" type="button" class="btn btn-secondary">Clear</button>
                <button [routerLink]="" type="button" class="btn btn-warning">Cancel</button>
                <button class="btn btn-primary">Save</button>
            </div>
        </div>
    </form>
</div>
