<div class="card">
    <div class="card-body">
       <app-Member-detail-component [Member]="BeltTestRes?.member"></app-Member-detail-component>
       <!-- <app-Course-detail-component [Course]="Course"></app-Course-detail-component> -->
        <div class="form-group">
            <label for="courseName"  class="form-label">Course Name</label>
            <input id="courseName" class="form-control" type="text" [value]="BeltTestRes?.course?.courseName" [disabled]="true">
        </div>
    </div>
    <div class="card-footer">
        <div class="footer-btns">
            <button class="btn btn-secondary">Cancel</button>
            <button class="btn btn-primary">Pass</button>
            <button [routerLink]="['/']" class="btn btn-outline-primary">Schedule Belt Test</button>
        </div>
    </div>
</div>
