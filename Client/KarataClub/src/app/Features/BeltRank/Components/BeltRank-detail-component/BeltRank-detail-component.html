<!-- <div class="card"> -->
    <div class="card-body">
        <div class="form-groups">
            <div class="form-group">
                <label for="name" class="form-label">BeltRank Name</label>
                <input type="text" id="name" [disabled]="true" [value]="BeltRank?.beltRank?.rankName" class="form-control">
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Fees</label>
                <input type="text" id="fees" [disabled]="true" [value]="BeltRank?.beltRank?.testFees" class="form-control">
            </div>
    
            <div class="form-group">
                <label for="active" class="form-label">Priority</label>
                <input type="text" id="active" [disabled]="true" [value]="BeltRank?.beltRank?.priority" class="form-control">
            </div>
             
        </div>
    </div>
