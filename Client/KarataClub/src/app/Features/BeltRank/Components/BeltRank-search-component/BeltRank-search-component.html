<div class="card">
   <form action="" [formGroup]="searchForm!" (submit)="Search()">

       <div class="card-body">
        <div class="form-groups">

            <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input formControlName="name" type="text" id="name" class="form-control">
            </div>          
            <div class="form-group">
                <label for="rankName" class="form-label">Lank Rank Name</label>
                <input formControlName="rankName" type="text" id="rankName" class="form-control">
            </div>          
        </div>
    </div>
    <div class="card-footer">
      <div class="footer-btns">
        <button (click)="ClearInput()" type="button" class="btn btn-secondary">Clear</button>
        <button  class="btn btn-primary">Search</button>
      </div>             
    </div>
</form>
</div>
